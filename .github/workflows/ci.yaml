name: CI

# datarango-frontend was the only repo in the platform with no workflow at all —
# every backend service has had one since Phase 0. Nine packages and four apps
# were being merged on the strength of whatever the author happened to run
# locally.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Formatting first: it is the fastest check and the one most likely to be
      # a one-line fix, so failing here does not make anybody wait on a build.
      - name: Format
        run: pnpm format:check

      # Lint genuinely runs now. Until 2026-08-10 no package defined a `lint`
      # script, so the root one shelled out to turbo, found nothing, and passed —
      # a green check that had inspected zero files.
      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      # Build catches what the other three cannot: a route that fails to
      # prerender, a server component importing something client-only, a bad
      # import path that tsc resolves and the bundler does not.
      - name: Build
        run: pnpm build

  smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      # The check none of the above can make: does the app actually render.
      # Typecheck and build both passed for weeks while the studio would have
      # read `undefined` from every field, because the gateway double-wrapped
      # its responses — types cannot catch a server disagreeing with them, and
      # a build cannot catch a page that throws on paint.
      - name: Smoke
        run: pnpm --filter web test:e2e

  # Publishes one release image per app to GHCR, for merges to main once
  # verify and smoke are green. Tags: `main` (moving) and `sha-<7>` (immutable,
  # what prod pins and rolls back to). Consumed by datarango-infra/compose.yml.
  #
  # NEXT_PUBLIC_* are inlined into the client bundle at build time, so the
  # public URLs come from repository variables (Settings → Secrets and
  # variables → Actions → Variables): PUBLIC_API_URL, WEB_URL, CONSOLE_URL,
  # STUDIO_URL, ADMIN_URL. The job is skipped until PUBLIC_API_URL is set,
  # rather than shipping images that point browsers at localhost.
  image:
    needs: [verify, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLIC_API_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: web, port: 4000, url_var: WEB_URL }
          - { app: console, port: 4001, url_var: CONSOLE_URL }
          - { app: studio, port: 4002, url_var: STUDIO_URL }
          - { app: admin, port: 4003, url_var: ADMIN_URL }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/datarango-${{ matrix.app }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          build-args: |
            APP=${{ matrix.app }}
            PORT=${{ matrix.port }}
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars[matrix.url_var] }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-app scope: the four builds share the install layers but would
          # otherwise overwrite each other's cache entry.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
